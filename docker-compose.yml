services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zelvira-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      DB_URL: jdbc:postgresql://zelvira-postgres:5432/${POSTGRES_DB:-zelvira}
      DB_USERNAME: ${POSTGRES_USER:-rizaldi}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://zelvira-postgres:5432/${POSTGRES_DB:-zelvira}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rizaldi}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-zelvira-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-zelvira-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://zelvira-minio:9000}
      MINIO_URL: ${MINIO_URL:-http://zelvira-minio:9000}
      MINIO_PUBLIC_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://minio.zelvira.my.id}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-zelixa-bucket}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/api/v1/products >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1280M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - zelvira-network

networks:
  zelvira-network:
    external: true
