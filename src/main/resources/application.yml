server:
  port: 8081
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics


logging:
    # com.zelvira.zelvira: DEBUG
    # org.springframework.web: INFO
    # org.hibernate.SQL: DEBUG
    # org.camunda.bpm.engine: INFO
    # org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

spring:
  application:
    name: zelvira
  output:
    ansi:
      enabled: always
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zelvira_ecommerce}
    username: ${DB_USERNAME:zelvira}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
       


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}




  mail:
    host: ${MAIL_HOST:mail.zelvira.co.id}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@zelvira.co.id}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:mail.zelvira.co.id}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
app:
  mail:
    from: ${MAIL_FROM:noreply@zelvira.co.id}
    sender-name: ${MAIL_SENDER_NAME:Zelixa Official}
  minio:
    url: ${MINIO_ENDPOINT:${MINIO_URL:http://localhost:9000}}
    public-url: ${MINIO_PUBLIC_URL:${NEXT_PUBLIC_STORAGE_URL:https://minio.zelvira.co.id}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:zelixa-bucket}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://api.zelvira.co.id/api/v1/auth/google/callback}
    frontend-url: ${NEXT_PUBLIC_WEB_URL:https://zelvira.co.id}

  rajaongkir:
    api-key: ${RAJAONGKIR_API_KEY:}
    base-url: ${RAJAONGKIR_BASE_URL:https://rajaongkir.komerce.id/api/v1/calculate/domestic-cost}

  midtrans:
    merchant-id: ${MIDTRANS_MERCHANT_ID:}
    server-key: ${MIDTRANS_SERVER_KEY:}
    client-key: ${MIDTRANS_CLIENT_KEY:}
    is-production: ${MIDTRANS_IS_PRODUCTION:true}

  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:firebase-service-account.json}

  zenziva:
    url: ${ZENZIVA_URL:https://console.zenziva.net/waofficial/api/sendWAOfficial/}
    userkey: ${ZENZIVA_USERKEY:}
    passkey: ${ZENZIVA_PASSKEY:}
    brand: ${ZENZIVA_BRAND:Zelvira}

  whatsapp:
    url: ${ZENZIVA_URL:https://console.zenziva.net/waofficial/api/sendWAOfficial/}
    userkey: ${ZENZIVA_USERKEY:}
    passkey: ${ZENZIVA_PASSKEY:}
    brand: ${ZENZIVA_BRAND:Zelvira}

  digiflazz:
    username: ${DIGIFLAZZ_USERNAME:}
    api-key: ${DIGIFLAZZ_API_KEY:}
    base-url: ${DIGIFLAZZ_BASE_URL:https://api.digiflazz.com/v1}

  tiktok:
    app-key: ${TIKTOK_APP_KEY:}
    app-secret: ${TIKTOK_APP_SECRET:}
    auth-url: ${TIKTOK_AUTH_URL:https://auth.tiktok-shops.com/oauth/authorize}
    api-base-url: ${TIKTOK_API_BASE_URL:https://open-api.tiktokglobalshop.com}

  instagram:
    app-id: ${INSTAGRAM_APP_ID:}
    app-secret: ${INSTAGRAM_APP_SECRET:}
    config-id: ${INSTAGRAM_CONFIG_ID:}
    business-id: ${INSTAGRAM_BUSINESS_ID:}
    account-id: ${INSTAGRAM_ACCOUNT_ID:}
    account-username: ${INSTAGRAM_ACCOUNT_USERNAME:zelviraofficialstore}
    webhook-verify-token: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN:zelvira_ig_verify_token_2026}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:https://api.zelvira.co.id/api/v1/callbacks/instagram/oauth}
    admin-redirect-url: ${NEXT_PUBLIC_ADMIN_URL:https://admin.zelvira.co.id}/admin/integrations/instagram

  threads:
    app-id: ${THREADS_APP_ID:1100121756212184}
    app-secret: ${THREADS_APP_SECRET:a2e05c4f4d61cbdd9a2a27d212e4f049}
    redirect-uri: ${THREADS_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/threads}

  social:
    tiktok:
      client-key: ${TIKTOK_SOCIAL_CLIENT_KEY:sbawknsk6eooabz8hq}
      client-secret: ${TIKTOK_SOCIAL_CLIENT_SECRET:7wWIblGTNxGUS0OoC01HdMd6pETdEt1g}
      redirect-uri: ${TIKTOK_SOCIAL_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/tiktok}
    instagram:
      redirect-uri: ${INSTAGRAM_SOCIAL_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/instagram}
    threads:
      app-id: ${THREADS_APP_ID:1100121756212184}
      app-secret: ${THREADS_APP_SECRET:a2e05c4f4d61cbdd9a2a27d212e4f049}
      redirect-uri: ${THREADS_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/threads}
    facebook:
      redirect-uri: ${FACEBOOK_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/facebook}
    linkedin:
      client-id: ${LINKEDIN_CLIENT_ID:}
      client-secret: ${LINKEDIN_CLIENT_SECRET:}
      organization-id: ${LINKEDIN_ORGANIZATION_ID:}
      redirect-uri: ${LINKEDIN_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/linkedin}
    x:
      client-id: ${X_CLIENT_ID:}
      client-secret: ${X_CLIENT_SECRET:}
      redirect-uri: ${X_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/x}
    youtube:
      client-id: ${YOUTUBE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
      client-secret: ${YOUTUBE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
      redirect-uri: ${YOUTUBE_REDIRECT_URI:https://api.zelvira.co.id/api/v1/social/callback/youtube}
    admin-redirect-url: ${NEXT_PUBLIC_ADMIN_URL:https://admin.zelvira.co.id}/admin/settings?tab=social

  nvidia:
    api-key: ${NVIDIA_API_KEY:}
    base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
    model: ${NVIDIA_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}
   
camunda:
  bpm:
    admin-user:
      id: admin
      password: ${CAMUNDA_ADMIN_PASSWORD:admin}
    filter:
      create: All Tasks
    database:
      type: postgres
      schema-update: true
    job-execution:
      enabled: true
